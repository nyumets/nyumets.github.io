<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}NYUMets</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="{{ '/assets/css/nocturne.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/nm-redesign.css' | relative_url }}">
</head>
<body>
<div class="nm-wrap">
{% include nm-nav.html %}
<main>{{ content }}</main>
{% include nm-footer.html %}
</div>
<script>
document.querySelector('.nm-menu').addEventListener('click', function () {
  var l = document.querySelector('.nm-links'); l.classList.toggle('open');
  this.setAttribute('aria-expanded', l.classList.contains('open'));
});
</script>
</body>
</html>
